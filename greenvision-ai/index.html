<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GreenVision.AI — AI-powered satellite intelligence for urban green cover assessment, tree detection, carbon sequestration, and oxygen estimation." />
    <meta name="theme-color" content="#14532d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GreenVision.AI — Urban Green Cover Intelligence" />
    <meta property="og:description" content="Analyze satellite imagery for canopy cover, tree detection, carbon sequestration, and oxygen estimates. Built for municipalities, industries, and citizens." />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <title>GreenVision.AI — Urban Green Cover Intelligence</title>
    <!-- Prevent flash-of-wrong-theme -->
    <script>
      (function() {
        var t = localStorage.getItem('gv-theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
